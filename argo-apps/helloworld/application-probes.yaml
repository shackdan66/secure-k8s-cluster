apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helloworld-NAMESPACE
  namespace: argocd
  annotations:
    #argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: it@bitbucket.org:slalom-consulting/demo.git
    path: manifests/sample-apps/helloworld
    targetRevision: HEAD
    helm:
      values: |
        customerService:
          hostname: HOSTNAME
        
        # Override resource limits
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        
        # Security Context Configuration
        podSecurityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          fsGroup: 1001
          seccompProfile:
            enabled: true
            type: RuntimeDefault
        
        containerSecurityContext:
          enabled: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            enabled: true
            drop:
              - ALL
          seccompProfile:
            enabled: true
            type: RuntimeDefault
        
        # Health Probes
        livenessProbe:
          enabled: true
          tcpSocket:
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          enabled: true
          httpGet:
            path: /hello
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

  destination:
    server: https://kubernetes.default.svc
    namespace: NAMESPACE
  
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - LabelNamespace=istio-injection=enabled