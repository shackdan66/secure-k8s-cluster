apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8spspseccomp
spec:
  crd:
    spec:
      names:
        kind: K8sPSPSeccomp
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedProfiles:
              type: array
              items:
                type: string
            exemptNamespaces:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spspseccomp

        # Check if namespace is exempt
        ns_is_exempt {
          input.review.object.metadata.namespace == input.parameters.exemptNamespaces[_]
        }
        
        # Check if profile is allowed
        profile_allowed(profile) {
          profile == input.parameters.allowedProfiles[_]
        }

        # Get pod spec based on resource type
        pod_spec = spec {
          input.review.kind.kind == "Pod"
          spec := input.review.object.spec
        }

        pod_spec = spec {
          input.review.kind.kind == "Deployment"
          spec := input.review.object.spec.template.spec
        }

        pod_spec = spec {
          input.review.kind.kind == "StatefulSet"
          spec := input.review.object.spec.template.spec
        }

        pod_spec = spec {
          input.review.kind.kind == "DaemonSet"
          spec := input.review.object.spec.template.spec
        }

        pod_spec = spec {
          input.review.kind.kind == "ReplicaSet"
          spec := input.review.object.spec.template.spec
        }

        # Get resource name for better error messages
        resource_name = name {
          input.review.kind.kind == "Pod"
          name := input.review.object.metadata.name
        }

        resource_name = name {
          input.review.kind.kind != "Pod"
          name := sprintf("%s/%s", [input.review.kind.kind, input.review.object.metadata.name])
        }

        # Check if seccompProfile field exists
        has_seccomp_profile {
          pod_spec.securityContext.seccompProfile
        }

        has_seccomp_profile {
          pod_spec.containers[_].securityContext.seccompProfile
        }

        # Violation: Missing seccompProfile entirely
        violation[{"msg": msg}] {
          not ns_is_exempt
          not has_seccomp_profile
          msg := sprintf("%v must define a seccompProfile", [resource_name])
        }

        # Violation: Pod-level seccompProfile not allowed
        violation[{"msg": msg}] {
          not ns_is_exempt
          profile := pod_spec.securityContext.seccompProfile.type
          not profile_allowed(profile)
          msg := sprintf("%v has disallowed pod-level seccompProfile: %v", [resource_name, profile])
        }

        # Violation: Container-level seccompProfile not allowed
        violation[{"msg": msg}] {
          not ns_is_exempt
          container := pod_spec.containers[_]
          profile := container.securityContext.seccompProfile.type
          not profile_allowed(profile)
          msg := sprintf("%v container <%v> has disallowed seccompProfile: %v", [resource_name, container.name, profile])
        }