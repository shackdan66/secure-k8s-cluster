#virtualservice.yaml
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: web-frontend2
spec:
  hosts:
    - {{ .Values.customerService.hostname }}
  gateways:
    - {{ printf "%s-%s" .Release.Namespace "demo-gateway" }}
  http:
    - route:
        - destination:
            host: web-frontend2.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80