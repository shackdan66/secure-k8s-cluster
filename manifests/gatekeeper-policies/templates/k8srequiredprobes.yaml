apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8srequiredprobes
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredProbes
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptNamespaces:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequiredprobes

        # Skip if pod has istio injection annotation
        has_istio_injection {
          input.review.object.metadata.annotations["sidecar.istio.io/inject"] == "true"
        }

        has_istio_injection {
          input.review.object.spec.template.metadata.annotations["sidecar.istio.io/inject"] == "true"
        }

        # Known sidecar containers
        is_sidecar(container_name) {
          container_name == "istio-proxy"
        }

        is_sidecar(container_name) {
          container_name == "istio-init"
        }

        # Get pod spec
        pod_spec = spec {
          input.review.kind.kind == "Pod"
          spec := input.review.object.spec
        }

        pod_spec = spec {
          input.review.kind.kind != "Pod"
          spec := input.review.object.spec.template.spec
        }

        # Check if namespace is exempt
        ns_is_exempt {
          input.review.object.metadata.namespace == input.parameters.exemptNamespaces[_]
        }

        violation[{"msg": msg}] {
          not ns_is_exempt
          not has_istio_injection  # Skip pods with Istio injection
          
          container := pod_spec.containers[_]
          not is_sidecar(container.name)
          
          probe := ["readinessProbe", "livenessProbe"][_]
          not container[probe]
        
          msg := sprintf("Container <%v> is missing required <%v>", [container.name, probe])
        }