replicas: 2
exemptNamespaces:
  - kube-system
  - gatekeeper-system
  - argocd
  - istio-system

# Webhook Configuration
webhook:
  enabled: true
  # Webhook service configuration
  service:
    type: ClusterIP
    port: 443
    targetPort: 8443
  
  # Webhook server configuration
  port: 8443
  certDir: /certs
  
  # Webhook timeout and failure policy
  timeoutSeconds: 3
  failurePolicy: Fail
  
  # Admission controller webhooks
  admissionReviewVersions: ["v1", "v1beta1"]
  
  # Certificate management
  certManager:
    enabled: false
  
  # Self-signed certificate configuration
  generateSelfSignedCert: true
  
  # Webhook rules - what resources to intercept
  rules:
    - operations: ["CREATE", "UPDATE"]
      apiGroups: "*"
      apiVersions: "*"
      resources: "*"
  
  # Namespace selector for webhook
  namespaceSelector:
    matchExpressions:
    - key: admission.gatekeeper.sh/ignore
      operator: DoesNotExist
    - key: name
      operator: NotIn
      values: 
        - kube-system
        - gatekeeper-system
        - argocd
        - istio-system

# Validating Admission Webhook Configuration
validatingAdmissionWebhook:
  enabled: true
  name: gatekeeper-validating-webhook-configuration
  
  # Webhook client configuration
  clientConfig:
    service:
      name: gatekeeper-webhook-service
      namespace: gatekeeper-system
      path: "/v1/admit"
      port: 443
  
  # Rules for validation webhook
  rules:
    - operations: ["CREATE", "UPDATE"]
      apiGroups: "*"
      apiVersions: "*"
      resources: "*"
      scope: "*"
  
  # Failure policy and side effects
  failurePolicy: Fail
  sideEffects: None
  admissionReviewVersions: ["v1", "v1beta1"]
  
  # Timeout
  timeoutSeconds: 10
  
  # Namespace selector
  namespaceSelector:
    matchExpressions:
    - key: admission.gatekeeper.sh/ignore
      operator: DoesNotExist
    - key: name
      operator: NotIn
      values: 
        - kube-system
        - gatekeeper-system
        - argocd
        - istio-system

# Mutating Admission Webhook Configuration
mutatingAdmissionWebhook:
  enabled: true
  name: gatekeeper-mutating-webhook-configuration
  
  # Webhook client configuration
  clientConfig:
    service:
      name: gatekeeper-webhook-service
      namespace: gatekeeper-system
      path: "/v1/mutate"
      port: 443
  
  # Rules for mutation webhook
  rules:
    - operations: ["CREATE", "UPDATE"]
      apiGroups: "*"
      apiVersions: "*"
      resources: "*"
      scope: "*"
  
  # Failure policy and side effects
  failurePolicy: Fail
  sideEffects: None
  admissionReviewVersions: ["v1", "v1beta1"]
  
  # Timeout
  timeoutSeconds: 10
  
  # Namespace selector
  namespaceSelector:
    matchExpressions:
    - key: admission.gatekeeper.sh/ignore
      operator: DoesNotExist
    - key: name
      operator: NotIn
      values: 
        - kube-system
        - gatekeeper-system
        - argocd
        - istio-system

# Controller Manager Configuration
controllerManager:
  # Webhook certificate configuration
  webhookCertificateConfig:
    caCertificateDuration: 43800h  # 5 years
    certificateDuration: 8760h     # 1 year
    renewBefore: 720h              # 30 days

# Resource constraints for webhook pods
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 999
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Health checks
livenessProbe:
  httpGet:
    path: /healthz
    port: 9090
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 9090
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Enable audit functionality
audit:
  enabled: true
  replicas: 1
  logLevel: INFO
  writeToRAMDisk: false
  
# Metrics and monitoring
metrics:
  enabled: true
  port: 8888

# Log level for debugging
logLevel: INFO

# Enable constraint evaluation logging
constraintViolationsLimit: 20

# Mutation logging
logMutations: false

# External data provider configuration
externalDataProvider:
  enabled: false